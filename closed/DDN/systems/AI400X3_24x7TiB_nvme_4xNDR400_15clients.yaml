System:
  name: AI400X3_24x7TiB_nvme_4xNDR400_15clients
  description: "DDN AI400X3 with EXAScaler parallel filesystem & 15 clients. Version: EXA6.3.3-2025032600 - SFAOS12.7.0. Software-defined: no. Hyperconverged: no."
  storage_location: remote
  client_software: proprietary
  storage_interface: file
  required_rack_units: 2
  shared_capabilities:
    multi_host_support: True
    simultaneous_write_support: True
    simultaneous_read_support: True
  max_sequential_read: 140
  max_sequential_write: 110

  use_local_storage: False
  num_clients_with_integrated_storage: 0

  system_architecture: shared file
  useable_capacity: 120

PowerRequirements:
  dlio_client:
    quantity: 15
    psu1_nameplate_power: 860
    psu2_nameplate_power: 860
    design_power: 860
    num_active_psus: 2
    num_passive_psus: 0
  storage_data_node:
    quantity: 1
    psu1_nameplate_power: 2400
    psu2_nameplate_power: 2400
    design_power: 2400
    num_active_psus: 2
    num_passive_psus: 0

Nodes:
  dlio_client:
    quantity: 15
    hardware:
      model: SMC AS-1115CS-TNR 
      rack_units: 1
      power_supplies: 2
      psu_configuration: active/active
      psu_rating: 860
      memory_capacity: 192GB
      memory_configuration: 12x16GB
      cpu_qty: 1
      cpu_model: AMD EPYC 9224 24-Core Processor
      cpu_cores: 24
    networking:
      data:
        model: "(MT4129 - MCX755106AS-HEAT) NVIDIA ConnectX-7 Adapter Card, 200GbE / NDR200, Dual-port QSFP112, PCIe 5.0x16 with x16 PCIe extension option" 
        speed: 200Gbps
        qty: 1
    operating_system:
      name: Rocky Linux
      version: "9.5 (Blue Onyx)"  # Matches /etc/*release output
      release_date: 2024-11-15  # Derived from kernel date (November 15, 2024)
      kernel_version: "5.14.0-503.14.1.el9_5.x86_64"  # From `uname -a`
      cpu_architecture: x86_64
    tuning:
      mpi_configuration:
        environment_variables: ["lctl set_param osc.*.max_pages_per_rpc=4M osc.*.max_rpcs_in_flight=1 osc.*.checksums=0"]
        version: MPICH 4.1.1
      sysctl_parameters: []

  storage_data_node:
    quantity: 1
    hardware:
      model: AI400X3
      rack_units: 2
      power_supplies: 2
      psu_configuration: active/active
      psu_rating: 2400
      memory_capacity: 768GB
      memory_configuration: 24x32GB
      cpu_qty: 2
      cpu_model: AMD EPYC 9454P 48-Core Emb Processor
      cpu_cores: 96
    networking:
      data:
        model: "(MT4129 - MCX75310AAS-NEAT) NVIDIA ConnectX-7 adapter card, 400Gb/s NDR IB , Single-port OSFP, PCIe 5.0 x16, Secure boot, No Crypto"
        speed: 400Gbps
        qty: 4
    operating_system:
      name: EXAScaler
      version: "6.3.3-2025032600 - SFAOS12.7.0"
      release_date: 2025-03-26
      kernel_version: "4.18.0-553.40.1.el8_lustre.ddn17.x86_64"
      cpu_architecture: x86_64
    tuning:
      mpi_configuration:
        environment_variables: ["NA"]
        version: "NA"
      sysctl_parameters: []
